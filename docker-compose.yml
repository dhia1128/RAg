services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: docqa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      OLLAMA_BASE_URL: http://ollama:11434
      OPENAI_MODEL: llama3.2
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: docqa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docqa_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  postgres_data:
  ollama_data: